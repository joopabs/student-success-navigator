[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssn"
version = "0.1.0"
description = "Fair and explainable first-semester dropout support-priority model with the Student Success Navigator Dash app"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Julius Pabular" }]
# Runtime dependencies are pinned in requirements.txt (the graded reproducibility source).
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "needs_data: tests that require the real UCI dataset under data/raw (excluded in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".specify", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ssn/reporting/tables.py" = ["E501"]  # markdown templates; long prose lines are intentional
"src/ssn/reporting/figures.py" = ["E501"]  # figure titles and labels
"src/ssn/modeling/commands.py" = ["E501"]  # console print statements
"src/ssn/reporting/model_card.py" = ["E501"]  # markdown template; long prose lines are intentional
"src/ssn/reporting/rubric_map.py" = ["E501"]  # markdown template
"src/ssn/app/pages/*.py" = ["E501"]  # adviser-facing UI copy
"src/ssn/app/components/*.py" = ["E501"]  # adviser-facing UI copy
"src/ssn/app/app.py" = ["E501"]  # inline CSS
"src/ssn/app/commands.py" = ["E501"]  # console print
"src/ssn/fairness/commands.py" = ["E501"]  # console print statements
"src/ssn/explain/commands.py" = ["E501"]  # console print statements
