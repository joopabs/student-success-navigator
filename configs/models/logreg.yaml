name: logreg
estimator: sklearn.linear_model.LogisticRegression
params:
  class_weight: balanced
  max_iter: 2000
  solver: liblinear
  random_state: ${seed}
search_space:
  C: {type: loguniform, low: 0.001, high: 100}
  l1_ratio: {type: choice, values: [0.0, 1.0]}   # 0.0 = L2, 1.0 = L1 (sklearn >= 1.8 API; liblinear supports both)
n_iter: 30
use_selection: true
use_pca: false
