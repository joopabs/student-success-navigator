name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: lint, secrets scan, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Secrets scan
        # SHA-256 checksums (64 hex) and git SHAs (40 hex) are recorded on purpose and excluded.
        run: make secrets

      - name: Config and allow-list validate
        run: python -m ssn config validate

      - name: Tests
        # Tests marked `needs_data` skip when data/raw is absent (it is Git-ignored).
        run: pytest -q

      - name: Adviser-facing language scan
        run: python -m ssn scan-language --paths README.md data docs reports src/ssn/app
